[project]
name = "rag-onprem-backend"
version = "0.1.0"
description = "On-premise RAG API: ingestion, retrieval and cited answers using local models only."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "alembic>=1.13",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "beautifulsoup4>=4.12",
    "argon2-cffi>=23.1",
    "fastembed>=0.5",
    "pypdfium2>=4.30",
    "pillow>=10.1",
    "ldap3>=2.9",
    # Outlook .msg emails (app.ingestion.msg). Pure Python, no network use:
    # olefile BSD-2-Clause, compressed-rtf MIT, striprtf BSD-3-Clause.
    # extract-msg was not used: it is GPL-3.0.
    "olefile>=0.47",
    "compressed-rtf>=1.0.6",
    "striprtf>=0.0.26",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-socket>=0.7",
    "ruff>=0.6",
    "mypy>=1.11",
    "pypdf>=5.0",  # builds test PDFs; the app reads PDFs with pypdfium2
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# No test may open a network socket (Unix sockets are allowed for the asyncio
# self-pipe). Integration tests opt in with @pytest.mark.enable_socket.
addopts = "--disable-socket --allow-unix-socket -m 'not compose and not db and not ldap'"
# ldap3 imports names pyasn1 has deprecated; nothing for us to change.
filterwarnings = [
    "ignore:tagMap is deprecated:DeprecationWarning",
    "ignore:typeMap is deprecated:DeprecationWarning",
]
markers = [
    "compose: needs the running docker compose stack (scripts/e2e.sh)",
    "db: needs a Postgres test database (scripts/test-db.sh)",
    "ldap: needs the OpenLDAP test server (scripts/test-ldap.sh)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]

[[tool.mypy.overrides]]
module = [
    "pgvector.*", "openpyxl.*", "onnxruntime.*", "fastembed.*", "pypdfium2.*", "ldap3.*",
    "olefile.*", "compressed_rtf.*", "striprtf.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.ingestion.msg"]
# striprtf ships untyped functions.
disallow_untyped_calls = false
