[project]
name = "rag-onprem-backend"
version = "0.1.0"
description = "On-premise RAG API: ingestion, retrieval and cited answers using local models only."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "alembic>=1.13",
    "httpx>=0.27",
    "pypdf>=5.0",
    "python-multipart>=0.0.9",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "beautifulsoup4>=4.12",
    "argon2-cffi>=23.1",
    "fastembed>=0.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-socket>=0.7",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# No test may open a network socket (Unix sockets are allowed for the asyncio
# self-pipe). Integration tests opt in with @pytest.mark.enable_socket.
addopts = "--disable-socket --allow-unix-socket -m 'not compose and not db'"
markers = [
    "compose: needs the running docker compose stack (scripts/e2e.sh)",
    "db: needs a Postgres test database (scripts/test-db.sh)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "openpyxl.*", "onnxruntime.*", "fastembed.*"]
ignore_missing_imports = true
