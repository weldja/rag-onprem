# Production-style stack. Run from the repo root via scripts/dev-up.sh, or:
#   docker compose --env-file .env -f deploy/docker-compose.yml up -d
#
# Network layout:
#   backend (internal: true)  db, ollama, api, proxy  - no route to the internet
#   edge                      proxy only              - the single published port
# The api, db and ollama containers therefore cannot make outbound connections.
name: rag-onprem

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://rag:${POSTGRES_PASSWORD}@db:5432/rag
  OLLAMA_URL: http://ollama:11434
  LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b-instruct}
  EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
  EMBED_DIM: ${EMBED_DIM:-1024}
  LLM_NUM_CTX: ${LLM_NUM_CTX:-8192}
  CHUNK_SIZE: ${CHUNK_SIZE:-1000}
  CHUNK_OVERLAP: ${CHUNK_OVERLAP:-150}
  TOP_K: ${TOP_K:-6}
  MIN_SIMILARITY: ${MIN_SIMILARITY:-0.35}
  RERANKER_MODEL: ${RERANKER_MODEL:-}
  RERANK_MIN_SCORE: ${RERANK_MIN_SCORE:-}
  OCR_ENABLED: ${OCR_ENABLED:-true}
  OCR_LANGUAGES: ${OCR_LANGUAGES:-eng}
  UPLOAD_DIR: /data/uploads
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-backend-build: &backend-build
  context: ../backend
  target: runtime
  args:
    RERANKER_MODEL: ${RERANKER_MODEL:-}
    OCR_LANGUAGES: ${OCR_IMAGE_LANGUAGES:-eng}

services:
  db:
    image: pgvector/pgvector:0.8.0-pg16@sha256:a132765ec351c65111b5b675928a3a0515a466a40f97277329db8b8209ad8bc9
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  ollama:
    # Models are pulled at BUILD time and baked into the image.
    # The running container never downloads anything.
    build:
      context: ./ollama
      args:
        LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b-instruct}
        EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
    image: rag-onprem/ollama:dev
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_CONTEXT_LENGTH: ${LLM_NUM_CTX:-8192}
      OLLAMA_NO_CLOUD: "1"
    networks: [backend]
    restart: unless-stopped

  api:
    build: *backend-build
    image: rag-onprem/api:dev
    # .env supplies optional settings such as LDAP_*; `environment` wins on overlap.
    env_file:
      - path: ../.env
        required: false
    environment: *backend-env
    volumes:
      - uploads:/data/uploads
      - ./certs:/etc/rag/certs:ro  # e.g. the directory's CA: LDAP_CA_FILE=/etc/rag/certs/ldap-ca.pem
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks: [backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).status == 200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  worker:
    # Same image as api; indexes uploaded documents from the Postgres job queue.
    # Starts after api is healthy, so migrations have already run.
    build: *backend-build
    image: rag-onprem/api:dev
    entrypoint: []
    command: ["python", "-m", "app.worker"]
    environment: *backend-env
    volumes:
      - uploads:/data/uploads
    depends_on:
      api:
        condition: service_healthy
    networks: [backend]
    restart: unless-stopped

  proxy:
    # nginx serving the built frontend, terminating TLS and proxying /api, so
    # the api can stay on the internal network. The only published ports.
    build:
      context: ../frontend
    image: rag-onprem/web:dev
    environment:
      HTTPS_PORT: ${HTTPS_PORT:-443}  # used in the HTTP -> HTTPS redirect
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTP_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    depends_on:
      api:
        condition: service_healthy
    networks: [backend, edge]
    restart: unless-stopped

networks:
  backend:
    internal: true
  edge: {}

volumes:
  pgdata:
  uploads:
